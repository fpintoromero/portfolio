name: weather_pipeline
version: "1.0.0"
config-version: 2
profile: weather_pipeline

model-paths: ["models"]
test-paths: ["tests"]

models:
  weather_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +partition_by: {field: observed_date, data_type: date}
      +cluster_by: ["city"]
