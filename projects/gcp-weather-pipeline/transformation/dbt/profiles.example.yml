# Copy to ~/.dbt/profiles.yml. Authenticates with `gcloud auth application-default login`.
weather_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: weather_analytics_dev
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000  # 1 GB safety cap per query
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: weather_analytics
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000
